[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cinemagraph-ai-generator"
version = "0.6.2"
description = "AI-powered cinemagraph generator for Windows — motion masking, loop synthesis, seamless export."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "cinemagraph-ai-generator contributors" }]
keywords = ["cinemagraph", "loop", "optical-flow", "diffusion", "desktop", "windows"]

dependencies = [
    "PySide6>=6.7,<7",
    "numpy>=1.26,<3",
    "opencv-python-headless>=4.9,<5",
    "pillow>=10.3,<12",
    "onnxruntime-gpu>=1.18,<2 ; platform_system=='Windows'",
    "pydantic>=2.7,<3",
    "tomli>=2.0 ; python_version<'3.11'",
    "typer>=0.12,<1",
    "rich>=13.7,<14",
    "loguru>=0.7,<1",
]

[project.optional-dependencies]
cuda = ["onnxruntime-gpu>=1.18,<2"]
cpu  = ["onnxruntime>=1.18,<2"]
dev  = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "mypy>=1.10",
    "ruff>=0.5",
    "types-Pillow",
]

[project.scripts]
cinemagraph = "cinemagraph.app.cli:main"

[project.gui-scripts]
cinemagraph-gui = "cinemagraph.app.bootstrap:run"

[tool.setuptools.packages.find]
include = ["cinemagraph*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "gpu: requires CUDA-capable device",
    "ffmpeg: requires ffmpeg on PATH",
]